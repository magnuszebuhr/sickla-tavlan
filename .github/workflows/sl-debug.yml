name: SL debug
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://transport.integration.sl.se/v1/sites?expand=true" > sites.json
          echo "== SITES =="
          jq -c '.[] | select(.name|test("^Sickla";"i")) | {id,name,lat,lon,stop_areas}' sites.json
          for id in $(jq -r '.[] | select(.name|test("^Sickla";"i")) | .id' sites.json); do
            echo "== DEPARTURES $id =="
            curl -s "https://transport.integration.sl.se/v1/sites/$id/departures?forecast=120" | jq -c '.departures[] | {l:.line.designation,m:.line.transport_mode,d:.destination,sp:.stop_point.id,spn:.stop_point.name,des:.stop_point.designation,sa:.stop_area.id,san:.stop_area.name,dir:.direction_code,disp:.display}' | sort -u -t, -k1,5 | head -40
          done
          echo "== STOP POINTS =="
          curl -s "https://transport.integration.sl.se/v1/stop-points" | jq -c '.[] | select(.name|test("^Sickla";"i")) | {id,name,designation,type,stop_area:.stop_area.id, san:.stop_area.name, sat:.stop_area.type}'
